<div class="retired-characters-list">
  <div *ngFor="let character of characters" class="character-item-container">
    <div class="character-header" (click)="toggleCharacter(character.name)">
      <div class="header-left">
        <img class="class-icon" [title]="character.characterClass.className" [src]="'assets/' + character.characterClass.image" />
        <span class="character-name">{{character.name}}</span>
      </div>
      <div class="header-right">
        <span class="character-info">{{character.characterClass.race}} {{character.characterClass.className}} — Lvl {{character.level}}</span>
        <span class="expand-icon" [class.rotated]="isExpanded(character.name)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
    </div>
    
    <div class="character-body" [class.expanded]="isExpanded(character.name)">
      <div class="body-content" *ngIf="isExpanded(character.name)">
        <app-player-sheet [character]="character"></app-player-sheet>
      </div>
    </div>
  </div>
</div>
